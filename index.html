                "poprawna": "c"
            }
        ];

        let currentIndex = 0;
        let score = 0;

        const quizBox = document.getElementById('quiz-box');
        const resultBox = document.getElementById('result-box');
        const progressText = document.getElementById('progress-text');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');

        function loadQuestion() {
            feedbackText.textContent = '';
            feedbackText.className = 'feedback';
            nextBtn.style.display = 'none';
            
            const p = pytania[currentIndex];
            progressText.textContent = `Pytanie ${p.id}/40`;
            questionText.textContent = p.pytanie;
            
            optionsContainer.innerHTML = '';
            
            const keys = ['a', 'b', 'c'];
            if (p.d) keys.push('d');
            
            keys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${key}) ${p[key]}`;
                btn.onclick = () => selectAnswer(key, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedKey, selectedBtn) {
            const p = pytania[currentIndex];
            const correctKey = p.poprawna.trim();
            const buttons = optionsContainer.getElementsByClassName('option-btn');
            
            for (let btn of buttons) {
                btn.disabled = true;
                const btnKey = btn.textContent.charAt(0);
                if (btnKey === correctKey) {
                    btn.classList.add('reveal-correct');
                }
            }
            
            if (selectedKey === correctKey) {
                selectedBtn.classList.remove('reveal-correct');
                selectedBtn.classList.add('selected-correct');
                feedbackText.textContent = 'Dobrze!';
                feedbackText.className = 'feedback correct';
                score++;
            } else {
                selectedBtn.classList.add('selected-wrong');
                feedbackText.textContent = `Źle. Prawidłowa odpowiedź to: ${correctKey}`;
                feedbackText.className = 'feedback wrong';
            }
            
            if (currentIndex < pytania.length - 1) {
                nextBtn.textContent = 'Następne pytanie';
                nextBtn.onclick = () => {
                    currentIndex++;
                    loadQuestion();
                };
            } else {
                nextBtn.textContent = 'Zakończ quiz';
                nextBtn.onclick = showResults;
            }
            nextBtn.style.display = 'block';
        }

        function showResults() {
            quizBox.style.display = 'none';
            resultBox.style.display = 'block';
            document.getElementById('final-score').textContent = `Twój wynik: ${score}/40`;
            const pct = ((score / 40) * 100).toFixed(1);
            document.getElementById('final-percentage').textContent = `(${pct}%)`;
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            resultBox.style.display = 'none';
            quizBox.style.display = 'block';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVPER GARAGE - Profesjonalny Serwis & Detailing</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Style Ogólne --- */
        :root {
            --primary-red: #e31b23; /* Główny czerwony akcent (pobrany z loga) */
            --dark-bg: #000000;    /* Główny głęboki czarny */
            --dark-card: #0a0a0a;  /* Troszkę jaśniejszy czarny dla kart */
            --silver-text: #cccccc; /* Srebrzysty tekst do opisów (pobrany z loga) */
            --text-light: #ffffff; /* Biały tekst */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* --- Nawigacja --- */
        header {
            background-color: rgba(0, 0, 0, 0.95);
            padding: 15px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary-red);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Tekstowe logo w barze, nawiązujące do grafiki */
        .logo {
            font-size: 26px;
            font-family: 'Oswald', sans-serif;
            color: var(--text-light);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--primary-red);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: bold;
            transition: color 0.3s;
            font-size: 14px;
            text-transform: uppercase;
        }

        nav a:hover {
            color: var(--primary-red);
        }

        /* --- Sekcja HERO (Centralne Logo) --- */
        .hero {
            height: 100vh; /* Na całą wysokość ekranu */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            
            /* TŁO: Głęboki czarny, aby logo z czerwoną aurą idealnie pasowało */
            background-color: var(--dark-bg);
            padding-top: 80px; /* Miejsce na fixed header */
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Ustawienie loga, aby było duże i centralne */
        .hero-logo {
            max-width: 600px; /* Ustal maksymalną szerokość dla dużych ekranów */
            width: 90%; /* Responsywna szerokość na mniejszych ekranach */
            height: auto;
            margin-bottom: 30px; /* Miejsce pod logo na przycisk */
        }

        /* Przyciski */
        .btn {
            display: inline-block;
            padding: 15px 35px;
            background-color: var(--primary-red);
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s, transform 0.2s;
            font-family: 'Oswald', sans-serif;
        }

        .btn:hover {
            background-color: #b7151a;
            transform: translateY(-3px);
        }

        /* --- Sekcje Główne --- */
        section {
            padding: 100px 0;
        }

        .section-title {
            text-align: center;
            font-size: 40px;
            margin-bottom: 60px;
        }

        .section-title span {
            border-bottom: 4px solid var(--primary-red);
            padding-bottom: 15px;
        }

        /* Usługi - lekkie wyostrzenie stylu */
        .services-grid {
            display: flex;
            gap: 40px;
            flex-wrap: wrap; /* Responsywność */
            margin-top: 30px;
        }

        .service-card {
            flex: 1; /* Równa szerokość */
            min-width: 280px;
            background-color: var(--dark-card);
            padding: 50px;
            border-radius: 10px;
            border: 2px solid transparent;
            transition: border-color 0.3s, transform 0.3s;
        }

        .service-card:hover {
            border-color: var(--primary-red);
            transform: translateY(-5px);
        }

        .service-card h3 {
            color: var(--primary-red);
            margin-bottom: 20px;
            font-size: 22px;
        }

        .service-card p {
            color: var(--silver-text); /* Srebrzysty tekst dla lepszego kontrastu */
            font-size: 15px;
        }

        /* --- Kontakt --- */
        #kontakt {
            background-color: var(--dark-card);
            text-align: center;
        }

        .contact-info {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 50px;
        }

        .contact-item {
            flex: 1;
            min-width: 250px;
        }

        .contact-item h4 {
            color: var(--primary-red);
            margin-bottom: 10px;
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
        }

        .contact-item p {
            color: var(--silver-text);
        }

        /* --- Stopka --- */
        footer {
            background-color: rgba(0, 0, 0, 0.95);
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid #222;
            font-size: 13px;
            color: var(--silver-text);
        }

        /* Responsywność dla mniejszych ekranów */
        @media (max-width: 768px) {
            .hero-logo {
                max-width: 400px;
            }
            .section-title {
                font-size: 32px;
            }
            .services-grid {
                flex-direction: column;
                gap: 20px;
            }
            .container {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <a href="#" class="logo">DAV<span>PER</span></a>
            <nav>
                <ul>
                    <li><a href="#home">Start</a></li>
                    <li><a href="#uslugi">Usługi</a></li>
                    <li><a href="#kontakt">Kontakt</a></li>
                </ul>
            </nav>
        </div>
    </header>
